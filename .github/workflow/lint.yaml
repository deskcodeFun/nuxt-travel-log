name: Lint

on:
  pull_request:
    # Sequence of patterns matched against refs/heads
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    environment: Build
    env:
      NODE_ENV: development
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
    steps:
      # 1. check out the project code
      - name: Checkout Repository
        uses: actions/checkout@v6
      # 2. install pnpm first (Importent: Must go before setup-node, pnpm/action-setup@v4)
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          # specify pnpm version
          version: 12
          runtime: node@24.x
          cache: true
      # 3. Clean install enforcing lockfile consistency
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 4. Execute your configured Nuxt / Antfu linter
      - name: Check linter
        run: pnpm lint
