name: Lint

on:
  pull_request:
    # Sequence of patterns matched against refs/heads
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    environment: Build
    env:
      NODE_ENV: development
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
      AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
    steps:
      # 1. check out the project code
      - name: Checkout Repository
        uses: actions/checkout@v6
      # - uses: actions/checkout@v6
      # 2. install pnpm first (Importent: Must go before setup-node, pnpm/action-setup@v4)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # specify pnpm version
          version: 11
      # 3. setup node.js and configure caching for pnpm
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          # cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install
      - name: Check linter
        run: pnpm lint
      - name: Fix linter
        run: pnpm lint:fix
