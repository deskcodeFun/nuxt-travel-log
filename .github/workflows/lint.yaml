name: Lint

on:
  pull_request:
    # Sequence of patterns matched against refs/heads
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm and Node
        uses: actions/setup@v3
        with:
          node-version: 24.x
      - run: pnpm install
      - run: pnpm lint
